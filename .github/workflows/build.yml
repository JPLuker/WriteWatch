name: Build and test WriteWatch
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxkbcommon-x11-0
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -v
      - run: python packaging/build.py
      - name: Verify packaged app starts
        run: python packaging/smoke.py
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash packaging/appimage.sh
      - name: Package and verify Debian installer
        if: runner.os == 'Linux'
        run: |
          python packaging/deb.py
          sudo apt-get install -y ./dist/*.deb
          python packaging/smoke_deb.py
          sudo apt-get remove -y writewatch
          test ! -e /usr/bin/writewatch
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "from writewatch import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WriteWatch-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish prerelease downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'from writewatch import __version__; print(__version__)')
          gh release create "v$version" artifacts/* --target "$GITHUB_SHA" --prerelease --title "WriteWatch v$version" --notes-file RELEASE_NOTES.md
